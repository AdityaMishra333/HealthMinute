<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4361ee" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Offline · HealthMinute</title>
    <!--
      Served by the service worker when a navigation fails. It has to stand on
      its own, so the tokens from src/styles/theme.css are inlined here; keep
      them in step with that file.
    -->
    <style>
      :root {
        --color-primary: #4361ee;
        --color-primary-dark: #3448c5;
        --ink-900: #12131a;
        --ink-700: #3a3f4b;
        --ink-500: #586274;
        --surface: #f4f6fb;
        --surface-card: #ffffff;
        --border: #e4e7ee;
        --r-sm: 8px;
        --r-lg: 18px;
        --shadow-md: 0 8px 24px rgba(16, 18, 26, 0.08);
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;

        font: 16px/1.5 var(--font-sans);
        color-scheme: light;
        color: var(--ink-700);
        background: var(--surface);
        -webkit-font-smoothing: antialiased;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .offline-card {
        background: var(--surface-card);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-md);
        padding: 28px 24px;
        max-width: 380px;
        width: 100%;
        text-align: center;
      }

      .offline-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 18px;
      }

      .offline-brand-mark {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        background: var(--color-primary);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .offline-brand h1 {
        font-size: 22px;
        font-weight: 700;
        color: var(--ink-900);
        margin: 0;
      }

      .offline-card h2 {
        font-size: 16px;
        font-weight: 600;
        color: var(--ink-900);
        margin: 0 0 8px;
      }

      .offline-card p {
        margin: 0;
        font-size: 14px;
        color: var(--ink-500);
      }

      .offline-note {
        margin-top: 16px !important;
        font-size: 13px;
      }

      .offline-status-icon {
        color: var(--ink-500);
        margin-bottom: 14px;
      }

      .btn {
        margin-top: 20px;
        border: none;
        border-radius: var(--r-sm);
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        line-height: 1.2;
        background: var(--color-primary);
        color: #fff;
        box-shadow: 0 4px 12px rgba(47, 111, 237, 0.28);
        transition: background 0.15s ease, transform 0.1s ease;
      }

      .btn:hover {
        background: var(--color-primary-dark);
      }

      .btn:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main class="offline-card">
      <div class="offline-brand">
        <span class="offline-brand-mark">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 3 21.5 20H2.5L12 3Z" />
            <path d="M12 9.5V14M12 17h.01" />
          </svg>
        </span>
        <h1>HealthMinute</h1>
      </div>

      <svg
        class="offline-status-icon"
        width="30"
        height="30"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M2 8.5a16 16 0 0 1 4.5-3M8.5 5.5A16 16 0 0 1 22 8.5" />
        <path d="M5.5 12.5a11 11 0 0 1 4-2.3M14.5 10.2a11 11 0 0 1 4 2.3" />
        <path d="M9 16.3a6 6 0 0 1 6 0" />
        <circle cx="12" cy="19.5" r="1.1" fill="currentColor" stroke="none" />
        <path d="M2 2l20 20" />
      </svg>

      <h2>You're offline</h2>
      <p>
        HealthMinute needs a connection to reach hospitals and drivers in real
        time, so it can't load right now.
      </p>
      <p class="offline-note">
        If this is an emergency, call your local emergency number instead of
        waiting for the connection.
      </p>

      <button class="btn" type="button" onclick="location.reload()">
        Try again
      </button>
    </main>

    <script>
      // Reload by itself the moment the connection is back.
      addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
